[project]
name = "esports-wiki-ai"
version = "0.1.0"
description = "RAG application answering esports questions from a private knowledge base"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pydantic>=2.7",
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-openai>=0.2",
    "qdrant-client>=1.10",
    "langchain-qdrant>=0.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langchain-community>=0.3",
    "langchain-classic>=1.0",
    "rank-bm25>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "black>=24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: tests that make real network calls (excluded by default)",
]
addopts = "-m \"not integration\""

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.black]
line-length = 100
target-version = ["py313"]
